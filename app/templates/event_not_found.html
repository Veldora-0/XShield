{% extends "base_console.html" %}

{% block title %}XShield Console &middot; Event Not Found{% endblock %}
{% block console_title %}Security Event Not Found{% endblock %}

{% block content %}
<div class="container event-not-found-page">
    <div class="soc-card result-card not-found-card">
        <div class="soc-eyebrow">
            <span class="eyebrow-dot"></span>
            <span>SECURITY EVENT</span>
        </div>
        <h1>Event not found</h1>
        <p class="empty-state">No security event exists for ID {{ event_id }}.</p>
        <div class="not-found-action">
            <a class="text-link" href="{{ url_for('main.dashboard') }}">&larr; Back to dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
