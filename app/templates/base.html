<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="XShield input security analysis interface">
    <title>{% block title %}XShield{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{{ url_for('main.index') }}" aria-label="XShield home">
                <span class="brand-mark" aria-hidden="true">X</span>
                <span>
                    <strong>XShield</strong>
                    <small>Security analysis platform</small>
                </span>
            </a>
            <div class="status-pill">
                <span class="status-dot" aria-hidden="true"></span>
                Prototype environment
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>XShield &middot; Built for responsible security learning</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
